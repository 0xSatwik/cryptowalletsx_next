# Netlify Configuration File

# Redirect old domain
[[redirects]]
  from = "https://cryptowalletsx.netlify.app/*"
  to = "https://cryptowalletsx.com/:splat"
  status = 301
  force = true


# Netlify settings
[build]
  publish = ".next"
  command = "npm run build"

# Custom headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin" 